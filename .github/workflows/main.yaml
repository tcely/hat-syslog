name: main
on: push
env:
    DOIT_NUM_PROCESS: 0
jobs:
    main:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: 'bash'
        steps:
            - name: checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
                  submodules: 'true'
            - name: install python
              uses: actions/setup-python@v7.1.0
              with:
                  cache: 'pip'
                  python-version-file: '.python-version'
            - name: install python requirements
              run: |
                  python -m pip install --upgrade pip
                  build_vendored() (
                      local dir

                      PIP_FIND_LINKS="$(realpath "${1}")"
                      export PIP_FIND_LINKS
                      mkdir -p "${PIP_FIND_LINKS}"
                      shift

                      for dir in "${@}"
                      do
                          pushd "${dir}" || continue
                          pip wheel --wheel-dir "${PIP_FIND_LINKS}" . || :
                          popd
                      done
                  )
                  build_vendored ./.vendor-dist vendor/hat-{aio,util,json,juggler}
                  pip install --find-links ./.vendor-dist --group dev -e .

            - name: doit check
              run: doit check
            - name: doit test
              run: doit test

    docker-image:
        uses: docker/github-builder/.github/workflows/build.yml@v1
        permissions:
            contents: read
            id-token: write
        secrets:
            registry-auths: |
                - registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
        with:
            cache: true
            cache-mode: max
            meta-flavor: latest=false
            meta-images: ghcr.io/${{ github.actor }}/hat-syslog
            meta-tags: |
                type=schedule,pattern=weekly
                type=raw,enable={{is_default_branch}},value=latest
                type=raw,enable={{is_not_default_branch}},value=test
                type=ref,event=tag
                type=ref,event=pr
            output: image
            platforms: linux/amd64,linux/arm64
            push: ${{ 'hat-open' == github.repository_owner && 'pull_request' != github.event_name }}
